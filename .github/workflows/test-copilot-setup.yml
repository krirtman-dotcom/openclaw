name: Test Copilot Setup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - '.github/workflows/test-copilot-setup.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify environment
        run: |
          echo "✓ Node version:"
          node --version
          echo "✓ pnpm version:"
          pnpm --version
          echo "✓ Git version:"
          git --version
          echo "✓ Dependencies installed (node_modules exists):"
          [ -d node_modules ] && echo "  ✓ node_modules exists" || echo "  ✗ WARNING: node_modules not found"
          echo "✓ pnpm-lock.yaml exists:"
          [ -f pnpm-lock.yaml ] && echo "  ✓ File exists" || echo "  ✗ WARNING: pnpm-lock.yaml not found"

      - name: Test key commands
        run: |
          echo "✓ Testing pnpm readiness..."
          pnpm --version && echo "  ✓ pnpm ready"
          echo "✓ Testing Node.js readiness..."
          node --version && echo "  ✓ Node.js ready"
